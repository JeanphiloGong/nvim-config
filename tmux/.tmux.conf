##### 基本设置 #####
set -g prefix C-a
unbind C-b
bind C-a send-prefix
set -g default-terminal "screen-256color"
set-option -sa terminal-overrides ',xterm-256color:RGB'

# 鼠标支持
set -g mouse on

# 更好的复制模式
setw -g mode-keys vi

# 设置复制模式快捷键
unbind -n C-o
bind -n C-o if-shell \
  "ps -o comm= -t '#{pane_tty}' | grep -iqE '^(vim|nvim)$'" \
  "send-keys C-o" \
  "copy-mode"

# 搜索和跳转
bind / command-prompt -p "search down" "send -X search-forward '%%'"
bind ? command-prompt -p "search up" "send -X search-backward '%%'"

# 平滑滚动体验（避免卡）
set -g history-limit 10000

##### 面板切换 #####
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

##### Plugins #####
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'jimeh/tmux-themepack'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

##### tmux-yank #####
# 默认 y 会 yank 并退出复制模式（copy-pipe-and-cancel）；这里改为 yank 后仍停留在复制模式（copy-pipe）
set -g @yank_action 'copy-pipe'

##### Continuum settings #####
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

##### tmux-resurrect #####
set -g @resurrect-capture-pane-contents 'on'

##### 初始化 TPM (必须放在最底部) #####
run '~/.tmux/plugins/tpm/tpm'

##### 状态栏（Focus / CPU / RAM / 时间）#####
set -g status-interval 2
set -g status-right-length 200
set -g status-left-length 100

# Focus：常驻显示“当前最重要的事”
# - 文件：~/.tmux-focus.md（首行显示在状态栏；其余行可写细节/清单）
# - 编辑：<prefix> + f（优先 popup；若 tmux 版本不支持则新开 window）
set -g status-left '#(f="$HOME/.tmux-focus.md"; line=$(head -n 1 "$f" 2>/dev/null | tr -d "\015"); if [ -n "$line" ]; then printf "FOCUS: %s" "$line"; else printf "FOCUS: -"; fi)'

# in .tmux.conf
set -g status-right "#(~/.tmux/plugins/tmux-continuum/scripts/continuum_save.sh) #(awk -v RS=\"\" '/^cpu / {u=$2+$4; t=$2+$4+$5; printf \"CPU: %.1f%%\", u*100/t}' /proc/stat) | #(free -m | awk '/Mem/ {printf \"RAM: %.1f%%\", $3*100/$2 }') | %a %h-%d %H:%M "

# Focus：弹窗/窗口编辑（display-popup 失败时自动 fallback）
bind-key f run-shell -b 'tmux display-popup -E -w 80% -h 60% -T "Focus" "sh -lc \"f=\\\"$HOME/.tmux-focus.md\\\"; touch \\\"$f\\\"; if command -v nvim >/dev/null 2>&1; then exec nvim \\\"$f\\\"; elif command -v vim >/dev/null 2>&1; then exec vim \\\"$f\\\"; else exec vi \\\"$f\\\"; fi\"" 2>/dev/null || tmux new-window -n "Focus" "sh -lc \"f=\\\"$HOME/.tmux-focus.md\\\"; touch \\\"$f\\\"; if command -v nvim >/dev/null 2>&1; then exec nvim \\\"$f\\\"; elif command -v vim >/dev/null 2>&1; then exec vim \\\"$f\\\"; else exec vi \\\"$f\\\"; fi\""'
