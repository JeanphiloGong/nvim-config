##### 基本设置 #####
set -g prefix C-a
unbind C-b
bind C-a send-prefix
set -g default-terminal "screen-256color"
set-option -sa terminal-overrides ',xterm-256color:RGB'
# Keep GUI/session environment available for clipboard tools inside tmux.
set -g update-environment "DISPLAY KRB5CCNAME MSYSTEM SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY WAYLAND_DISPLAY"

# 鼠标支持
set -g mouse on

# 更好的复制模式
setw -g mode-keys vi

# Cursor: prefer terminal color, use block for clarity
set -g cursor-style block
set -g cursor-colour default

# 设置复制模式快捷键
unbind -n C-o
bind -n C-o if-shell \
  "ps -o comm= -t '#{pane_tty}' | grep -iqE '^(vim|nvim)$'" \
  "send-keys C-o" \
  "copy-mode"

# 搜索和跳转
bind / command-prompt -p "search down" "send -X search-forward '%%'"
bind ? command-prompt -p "search up" "send -X search-backward '%%'"

# 平滑滚动体验（避免卡）
set -g history-limit 10000

# 窗口切换
bind-key l last-window

# 分屏时继承当前 pane 路径
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# choose-tree 中调整窗口顺序
bind-key -T choose-tree J swap-window -t +1
bind-key -T choose-tree K swap-window -t -1

# 当前窗口在状态栏中左/右移动一位
bind-key -r < swap-window -t -1 \; select-window -t -1
bind-key -r > swap-window -t +1 \; select-window -t +1

##### Plugins #####
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'jimeh/tmux-themepack'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

##### tmux-yank #####
# 默认 y 会 yank 并退出复制模式（copy-pipe-and-cancel）；这里改为 yank 后仍停留在复制模式（copy-pipe）
set -g @yank_action 'copy-pipe'

##### Continuum settings #####
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

##### tmux-resurrect #####
set -g @resurrect-capture-pane-contents 'on'

##### 初始化 TPM（建议靠近底部；本文件后面还有覆盖绑定）#####
run '~/.tmux/plugins/tpm/tpm'

##### 状态栏（Codex / Git / CPU / RAM / 时间）#####
set -g status-interval 5
set -g status-right-length 200
set -g status-left-length 30

# 两行状态栏：
# - 第 1 行：正常状态栏（window 列表 + status-left/status-right）
# - 第 2 行：左侧共享消息槽（Codex/Language 常驻，后触发覆盖前触发）；右侧 Git 状态
set -g status 2
# 输入提示与消息显示在第 2 行（索引从 0 开始）
set -g message-line 1
set -g status-format[1] '#[align=left]#(~/.config/nvim/tmux/bin/tmux-git-status "#{pane_current_path}")#[align=right]#{?@shared_status_msg,#{=/110/...:@shared_status_msg},}'
# 第 1 行左侧只显示 session 名称（导航信息，避免抢占注意力）
set -g status-left '#[fg=colour245][#{session_name} #{session_id}]'

# Pane 标记：显示 pane 编号/ID，并高亮“最后一次 Codex 完成”的 pane
set -g pane-border-status top
set -g pane-border-format '#[fg=colour240]#P #[fg=colour240]| #[fg=colour39]#{?@user_pane_title,#{=/24/...:@user_pane_title},-} #[fg=colour240]| #[fg=colour208]#{?@codex_pane_activity,#{=/52/...:@codex_pane_activity},#{?@codex_pane_summary,#{=/52/...:@codex_pane_summary},-}}'
# 某些 tmux 版本不支持 pane-active-border-format，使用 active-border-style 兼容
set -g pane-active-border-style 'fg=colour45'

# 手动标记：快速改 pane / window 标题（表达“正在做什么”）
bind-key T command-prompt -p "pane label" "set -p @user_pane_title '%%'"
bind-key W command-prompt -p "window name" "rename-window '%%'"

# in .tmux.conf
set -g status-right "#(~/.tmux/plugins/tmux-continuum/scripts/continuum_save.sh) #(awk -v RS=\"\" '/^cpu / {u=$2+$4; t=$2+$4+$5; printf \"CPU: %.1f%%\", u*100/t}' /proc/stat) | #(free -m | awk '/Mem/ {printf \"RAM: %.1f%%\", $3*100/$2 }') | %a %h-%d %H:%M "

##### Codex（可选）：turn 完成提示 + 快速跳回 #####
# 依赖 Codex CLI 的 notify hook（agent-turn-complete）把位置写入 tmux option：
# - @codex_last_win  / @codex_last_pane：最后一次完成的位置
# - ~/.tmux-codex-history：历史记录（用于菜单选择）
set -g @codex_history_file "$HOME/.tmux-codex-history"
# Codex 和 Language 共用第二行常驻消息槽（不再额外弹消息条）
set -g @codex_notify_mode "off" # popup | message | off

# <prefix> + C：打开 nvim agent 控制面板，支持 Ctrl-h/j/k/l 移动，Space 跳转到选中 pane
bind-key C new-window -n agent-board 'TMUX_AGENT_BOARD_QUIT_ON_JUMP=1 nvim -c "AgentBoard"'

# <prefix> + M：保留原 Codex / Orch 菜单
bind-key M run-shell -b 'bash "${XDG_CONFIG_HOME:-$HOME/.config}/nvim/tmux/bin/codex-tmux-menu"'

# <prefix> + J：一键跳回“最后一次完成”的 Codex pane
bind-key J run-shell -b 'bash "${XDG_CONFIG_HOME:-$HOME/.config}/nvim/tmux/bin/codex-tmux-jump-last"'

# <prefix> + f：右侧分屏，并从当前 pane 前台进程环境变量 fork（CODEX_SESSION_ID/THREAD_ID）
bind-key f run-shell -b 'bash "${XDG_CONFIG_HOME:-$HOME/.config}/nvim/tmux/bin/codex-tmux-fork-current" h'

# <prefix> + F：下方分屏，并从当前 pane 前台进程环境变量 fork（CODEX_SESSION_ID/THREAD_ID）
bind-key F run-shell -b 'bash "${XDG_CONFIG_HOME:-$HOME/.config}/nvim/tmux/bin/codex-tmux-fork-current" v'

# Popup 终端：在当前 pane 路径打开一个临时 shell
bind-key G display-popup -E -w 90% -h 85% -T "Terminal" -d "#{pane_current_path}" "bash"

# 复制当前 pane 路径对应仓库的 Git 分支名
bind-key b run-shell -b 'bash "${XDG_CONFIG_HOME:-$HOME/.config}/nvim/tmux/bin/tmux-copy-git-branch" "#{pane_current_path}"'

# Language Coach：e = 快速翻译，E = 带上下文/多行翻译
unbind-key -q g
unbind-key -q e
unbind-key -q E
bind-key e display-popup -E -w 90% -h 8 -T "Language Input" -d "#{pane_current_path}" 'bash "${XDG_CONFIG_HOME:-$HOME/.config}/nvim/tmux/bin/tmux-language-input"'
bind-key E display-popup -E -w 90% -h 80% -T "Language Context" -d "#{pane_current_path}" 'bash "${XDG_CONFIG_HOME:-$HOME/.config}/nvim/tmux/bin/tmux-language-context-input"'

# Language Coach History：只读历史查看
bind-key H display-popup -E -w 90% -h 65% -T "Language History" 'bash "$HOME/.config/nvim/tmux/bin/tmux-language-history"'
